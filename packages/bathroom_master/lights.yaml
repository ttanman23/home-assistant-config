automation:
- alias: Bathroom Master - Automatic Lights
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.bathroom_master_motion_sensors
    from: 'off'
    to: 'on'
    id: MotionOn
    trigger: state
  - entity_id:
    - binary_sensor.bathroom_master_motion_sensors
    from: 'on'
    to: 'off'
    id: MotionOff
    for:
      hours: 0
      minutes: 0
      seconds: 30
    trigger: state
  - trigger: state
    entity_id:
    - light.a810acaa571a62d588d1d4c5afc5de31_button_5_lights
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: LightSource_Off_AdaptiveLighting_Reset
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - MotionOn
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.adaptive_lighting_reset_''~area_name,
            ''off'') }}

            '
          alias: Input Boolean Adaptive Lighting Reset == Off
        then:
        - action: scene.turn_on
          metadata: {}
          data: {}
          target:
            entity_id: 'scene.{{device_id}}_{{button_name}}_{{ states(''input_select.''~device_id~''_''~button_name~''_scene_input'')
              | lower | replace(" ", "_") }}

              '
          alias: Activate current scene in Scene Selector
        else:
        - action: input_select.select_option
          metadata: {}
          data:
            option: Adaptive Lighting Reset
          target:
            entity_id: 'input_select.{{device_id}}_{{button_name}}_scene_input

              '
          alias: Scene Selector SELECT Adaptive Lighting Reset
        - action: input_boolean.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: input_boolean.adaptive_lighting_reset_{{area_name}}
          alias: Input boolean  TURN OFF Adaptive Lighting Reset
    - conditions:
      - condition: trigger
        id:
        - MotionOff
      sequence:
      - action: scene.create
        metadata: {}
        data:
          scene_id: '{{device_id}}_{{button_name}}_last_on

            '
          snapshot_entities: '{{ expand(light_source) | map(attribute=''entity_id'')
            | list }}

            '
      - action: input_select.select_option
        metadata: {}
        data:
          option: Last On
        target:
          entity_id: 'input_select.{{device_id}}_{{button_name}}_scene_input

            '
        alias: Scene Selector SELECT Last On
      - target:
          entity_id: '{{light_source}}

            '
        data:
          transition: 30
        action: light.turn_off
        alias: Light TURN OFF light_source
    - conditions:
      - condition: trigger
        id:
        - MotionIdle
      sequence:
      - metadata: {}
        data:
          brightness_step_pct: -50
        target:
          entity_id: light.aqara_t1m_ceiling_main_light
        enabled: false
        action: light.turn_on
    - conditions:
      - condition: trigger
        id:
        - LightSource_Off_AdaptiveLighting_Reset
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.adaptive_lighting_reset_{{area_name}}
        alias: Input Boolean TURN ON Adaptive Lighting Reset
    - conditions:
      - condition: trigger
        id:
        - Hallway Angle
      - condition: state
        entity_id: light.aqara_t1m_ceiling_main_light
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.apollo_mtr_1_ce9998_hallway_target_1_x
        above: 20
      sequence:
      - metadata: {}
        data: {}
        target:
          entity_id:
          - light.aqara_t1m_ceiling_main_light
        action: light.turn_on
    - conditions:
      - condition: trigger
        id:
        - Light ON 30
      - condition: state
        entity_id: binary_sensor.bathroom_master_motion_sensors
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.everything_presence_lite_f1c3b8_target_1_angle
        below: 30
      sequence:
      - metadata: {}
        data: {}
        target:
          entity_id: light.aqara_t1m_ceiling_main_light
        action: light.turn_off
  variables:
    replace_light: light.a810acaa571a62d588d1d4c5afc5de31_button_5_lights
    replace_sensor: binary_sensor.bathroom_master_motion_sensors
    device_id: a810acaa571a62d588d1d4c5afc5de31
    button_name: button_5
    light_source: light.a810acaa571a62d588d1d4c5afc5de31_button_5_lights
    button_number: '{{ button_name.split(''_'')[1] }}'
    area_name: '{{area_name(trigger.entity_id) | lower | replace('' '', ''_'') }}'
  mode: single
  '#id': '1760492822237'
  enabled: false
